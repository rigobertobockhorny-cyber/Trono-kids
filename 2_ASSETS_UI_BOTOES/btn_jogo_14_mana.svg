<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg14" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <filter id="sh14">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg14)" stroke="#fb923c" stroke-width="4" filter="url(#sh14)"/>
  <!-- Flocos de maná caindo do céu -->
  <circle cx="36" cy="32" r="4.5" fill="#ffffff" filter="url(#sh14)"/>
  <circle cx="64" cy="24" r="5" fill="#ffffff" filter="url(#sh14)"/>
  <circle cx="92" cy="34" r="4.5" fill="#ffffff" filter="url(#sh14)"/>
  <circle cx="50" cy="42" r="3.5" fill="#fef08a"/>
  <circle cx="78" cy="40" r="3.5" fill="#fef08a"/>
  <!-- Cesta de Maná -->
  <g transform="translate(64, 78)" filter="url(#sh14)">
    <!-- Pãezinhos dentro da cesta -->
    <circle cx="-14" cy="-4" r="10" fill="#fef08a"/>
    <circle cx="14" cy="-4" r="10" fill="#fef08a"/>
    <circle cx="0" cy="-8" r="12" fill="#ffffff"/>
    <circle cx="0" cy="-6" r="10" fill="#fef08a"/>
    <!-- Cesto trançado -->
    <path d="M-34 0 L-26 24 L26 24 L34 0 Z" fill="#b45309" stroke="#78350f" stroke-width="2.5"/>
    <line x1="-30" y1="12" x2="30" y2="12" stroke="#d97706" stroke-width="2.5"/>
    <!-- Alça da cesta -->
    <path d="M-32 0 Q0 -34 32 0" fill="none" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- Brilho no topo -->
  <path d="M16 16 Q64 8 112 16 Q64 32 16 16 Z" fill="#ffffff" opacity="0.25"/>
</svg>