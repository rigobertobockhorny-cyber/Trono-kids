<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="sh6">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg6)" stroke="#fcd34d" stroke-width="4" filter="url(#sh6)"/>
  <!-- Linhas de corrida -->
  <line x1="16" y1="64" x2="34" y2="64" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="20" y1="74" x2="40" y2="74" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="14" y1="84" x2="30" y2="84" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Ovelha em salto -->
  <g transform="translate(68, 56) rotate(-12)" filter="url(#sh6)">
    <!-- Corpo -->
    <ellipse cx="0" cy="0" rx="22" ry="16" fill="#ffffff"/>
    <circle cx="-12" cy="-4" r="10" fill="#ffffff"/>
    <circle cx="10" cy="-4" r="10" fill="#ffffff"/>
    <!-- Patinhas esticadas correndo -->
    <path d="M-14 10 L-26 22" stroke="#334155" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M12 10 L26 20" stroke="#334155" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Cabeça com laço ou sino -->
    <ellipse cx="18" cy="-8" rx="10" ry="12" fill="#f8fafc"/>
    <ellipse cx="26" cy="-14" rx="4" ry="7" transform="rotate(25 26 -14)" fill="#fed7aa"/>
    <!-- Olhinho feliz piscando -->
    <path d="M16 -8 Q19 -12 22 -8" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <circle cx="21" cy="-3" r="2" fill="#f472b6"/>
  </g>
  <!-- Brilho no topo -->
  <path d="M16 16 Q64 8 112 16 Q64 32 16 16 Z" fill="#ffffff" opacity="0.25"/>
</svg>