<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" width="100%" height="100%">
  <defs>
    <!-- Gradiente do Casco de Madeira -->
    <linearGradient id="madeiraCasco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="50%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <!-- Gradiente da Cabine -->
    <linearGradient id="madeiraCabine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Gradiente do Telhado -->
    <linearGradient id="telhadoArca" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <!-- Filtro de Sombra 3D -->
    <filter id="sombra3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Arco-Íris da Aliança no topo -->
  <g opacity="0.9" filter="url(#sombra3d)">
    <path d="M25 75 A55 55 0 0 1 135 75" fill="none" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M29 75 A51 51 0 0 1 131 75" fill="none" stroke="#f97316" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M33 75 A47 47 0 0 1 127 75" fill="none" stroke="#fde047" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M37 75 A43 43 0 0 1 123 75" fill="none" stroke="#22c55e" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M41 75 A39 39 0 0 1 119 75" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M45 75 A35 35 0 0 1 115 75" fill="none" stroke="#a855f7" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Ondinhas de água sob o casco -->
  <path d="M10 125 Q35 118 60 125 T110 125 T150 125 L150 135 L10 135 Z" fill="#0284c7" opacity="0.8"/>
  <path d="M18 128 Q45 122 75 128 T135 128 L135 138 L18 138 Z" fill="#0369a1"/>

  <!-- Corpo Principal da Arca -->
  <g filter="url(#sombra3d)">
    <!-- Casco -->
    <path d="M18 85 L35 124 L125 124 L142 85 Z" fill="url(#madeiraCasco)" stroke="#451a03" stroke-width="3"/>
    <!-- Tábuas de Madeira do Casco -->
    <line x1="24" y1="97" x2="136" y2="97" stroke="#b45309" stroke-width="2.5" opacity="0.6"/>
    <line x1="30" y1="110" x2="130" y2="110" stroke="#78350f" stroke-width="2.5" opacity="0.6"/>

    <!-- Cabine Superior -->
    <rect x="42" y="54" width="76" height="34" rx="4" fill="url(#madeiraCabine)" stroke="#451a03" stroke-width="2.5"/>

    <!-- Telhado em Duas Águas -->
    <polygon points="36,56 80,38 124,56" fill="url(#telhadoArca)" stroke="#451a03" stroke-width="3"/>
    <!-- Beiral do Telhado -->
    <line x1="34" y1="56" x2="126" y2="56" stroke="#451a03" stroke-width="3"/>

    <!-- Janelas Iluminadas com Luz Dourada -->
    <rect x="52" y="64" width="14" height="14" rx="3" fill="#fef08a" stroke="#78350f" stroke-width="2"/>
    <rect x="73" y="64" width="14" height="14" rx="3" fill="#fef08a" stroke="#78350f" stroke-width="2"/>
    <rect x="94" y="64" width="14" height="14" rx="3" fill="#fef08a" stroke="#78350f" stroke-width="2"/>

    <!-- Luz das Janelas -->
    <circle cx="59" cy="71" r="3" fill="#ffffff" opacity="0.8"/>
    <circle cx="80" cy="71" r="3" fill="#ffffff" opacity="0.8"/>
    <circle cx="101" cy="71" r="3" fill="#ffffff" opacity="0.8"/>

    <!-- Janelinha de Pouso da Pombinha no Telhado -->
    <polygon points="74,50 80,44 86,50" fill="#fde047" stroke="#78350f" stroke-width="1.5"/>
  </g>
</svg>