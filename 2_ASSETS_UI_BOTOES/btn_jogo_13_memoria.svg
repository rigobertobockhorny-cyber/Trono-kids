<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg13" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="sh13">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg13)" stroke="#fbbf24" stroke-width="4" filter="url(#sh13)"/>
  <!-- Carta 1 (esquerda, girada) -->
  <g transform="translate(46, 64) rotate(-10)" filter="url(#sh13)">
    <rect x="-20" y="-28" width="40" height="56" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="0" cy="-4" r="13" fill="#fef08a"/>
