<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="netGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <filter id="goldGleam" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#fde047" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Brilho Mágico de Fundo -->
  <circle cx="100" cy="100" r="90" fill="url(#netGlow)"/>

  <!-- Rede de Malha Aberta Circular (Tarrafa) -->
  <g stroke="#fde047" stroke-width="1.8" fill="rgba(254, 240, 138, 0.12)" filter="url(#goldGleam)">
    <!-- Círculos concêntricos de expansão -->
    <ellipse cx="100" cy="100" rx="20" ry="14"/>
    <ellipse cx="100" cy="100" rx="42" ry="30"/>
    <ellipse cx="100" cy="100" rx="66" ry="46"/>
    <ellipse cx="100" cy="100" rx="88" ry="60"/>

    <!-- Raios radiais da malha -->
    <line x1="100" y1="100" x2="100" y2="40"/>
    <line x1="100" y1="100" x2="100" y2="160"/>
    <line x1="100" y1="100" x2="12" y2="100"/>
    <line x1="100" y1="100" x2="188" y2="100"/>
    <line x1="100" y1="100" x2="38" y2="58"/>
    <line x1="100" y1="100" x2="162" y2="142"/>
    <line x1="100" y1="100" x2="162" y2="58"/>
    <line x1="100" y1="100" x2="38" y2="142"/>

    <!-- Raios intermediários -->
    <line x1="100" y1="100" x2="70" y2="44"/>
    <line x1="100" y1="100" x2="130" y2="44"/>
    <line x1="100" y1="100" x2="70" y2="156"/>
    <line x1="100" y1="100" x2="130" y2="156"/>
    <line x1="100" y1="100" x2="18" y2="78"/>
    <line x1="100" y1="100" x2="182" y2="78"/>
    <line x1="100" y1="100" x2="18" y2="122"/>
    <line x1="100" y1="100" x2="182" y2="122"/>
  </g>

  <!-- Chumbadas / Pesos dourados em toda a borda da rede -->
  <g fill="#eab308" stroke="#713f12" stroke-width="1.2">
    <circle cx="100" cy="40" r="4.5"/>
    <circle cx="135" cy="46" r="4.5"/>
    <circle cx="165" cy="62" r="4.5"/>
    <circle cx="185" cy="85" r="4.5"/>
    <circle cx="188" cy="100" r="4.5"/>
    <circle cx="185" cy="115" r="4.5"/>
    <circle cx="165" cy="138" r="4.5"/>
    <circle cx="135" cy="154" r="4.5"/>
    <circle cx="100" cy="160" r="4.5"/>
    <circle cx="65" cy="154" r="4.5"/>
    <circle cx="35" cy="138" r="4.5"/>
    <circle cx="15" cy="115" r="4.5"/>
    <circle cx="12" cy="100" r="4.5"/>
    <circle cx="15" cy="85" r="4.5"/>
    <circle cx="35" cy="62" r="4.5"/>
    <circle cx="65" cy="46" r="4.5"/>
  </g>

  <!-- Ponto central de fixação da corda de tração -->
  <circle cx="100" cy="100" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
  <!-- Corda de subida -->
  <path d="M 100 100 Q 95 60 100 0" stroke="#fef08a" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>