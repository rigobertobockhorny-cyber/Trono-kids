<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <!-- Brilho aquático suave e cristalino -->
    <radialGradient id="waterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="65%" stop-color="#bae6fd" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="whiteGleam" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#ffffff" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Fundo com leve refração aquática translúcida -->
  <circle cx="110" cy="110" r="100" fill="url(#waterGlow)"/>

  <!-- Malha da Rede de Pesca (Tarrafa) 100% em Linhas Brancas Cristalinas -->
  <g stroke="#ffffff" stroke-width="1.8" fill="rgba(255, 255, 255, 0.08)" stroke-linecap="round" stroke-linejoin="round" filter="url(#whiteGleam)">
    <!-- Círculos concêntricos ovais (profundidade 3D) -->
    <ellipse cx="110" cy="110" rx="22" ry="16"/>
    <ellipse cx="110" cy="110" rx="46" ry="32"/>
    <ellipse cx="110" cy="110" rx="72" ry="50"/>
    <ellipse cx="110" cy="110" rx="96" ry="66"/>

    <!-- Tramas diagonais cruzadas (Padrão Diamante Autêntico de Rede de Pesca) -->
    <!-- Feixe 1: Radiais principais -->
    <line x1="110" y1="110" x2="110" y2="44"/>
    <line x1="110" y1="110" x2="110" y2="176"/>
    <line x1="110" y1="110" x2="14" y2="110"/>
    <line x1="110" y1="110" x2="206" y2="110"/>
    <line x1="110" y1="110" x2="42" y2="64"/>
    <line x1="110" y1="110" x2="178" y2="156"/>
    <line x1="110" y1="110" x2="178" y2="64"/>
    <line x1="110" y1="110" x2="42" y2="156"/>

    <!-- Feixe 2: Radiais intermediários -->
    <line x1="110" y1="110" x2="76" y2="48"/>
    <line x1="110" y1="110" x2="144" y2="48"/>
    <line x1="110" y1="110" x2="76" y2="172"/>
    <line x1="110" y1="110" x2="144" y2="172"/>
    <line x1="110" y1="110" x2="20" y2="86"/>
    <line x1="110" y1="110" x2="200" y2="86"/>
    <line x1="110" y1="110" x2="20" y2="134"/>
    <line x1="110" y1="110" x2="200" y2="134"/>
  </g>

  <!-- Malha fina secundária (Fios brancos finos para textura realista de rede) -->
  <g stroke="rgba(255, 255, 255, 0.65)" stroke-width="1.1" fill="none">
    <ellipse cx="110" cy="110" rx="34" ry="24"/>
    <ellipse cx="110" cy="110" rx="59" ry="41"/>
    <ellipse cx="110" cy="110" rx="84" ry="58"/>
    
    <!-- Linhas cruzadas tipo diamante -->
    <path d="M 64 69 L 110 44 L 156 69 L 182 110 L 156 151 L 110 176 L 64 151 L 38 110 Z" stroke-dasharray="3,2"/>
    <path d="M 80 82 L 110 65 L 140 82 L 156 110 L 140 138 L 110 155 L 80 138 L 64 110 Z" stroke-dasharray="2,2"/>
  </g>

  <!-- Cordão de borda reforçado branco -->
  <ellipse cx="110" cy="110" rx="96" ry="66" fill="none" stroke="#ffffff" stroke-width="2.8"/>

  <!-- Chumbadas / Pesos marítimos na borda (Tons prateados com brilho branco) -->
  <g fill="#e2e8f0" stroke="#475569" stroke-width="1.2">
    <circle cx="110" cy="44" r="4.5"/>
    <circle cx="148" cy="50" r="4.5"/>
    <circle cx="182" cy="67" r="4.5"/>
    <circle cx="203" cy="92" r="4.5"/>
    <circle cx="206" cy="110" r="4.5"/>
    <circle cx="203" cy="128" r="4.5"/>
    <circle cx="182" cy="153" r="4.5"/>
    <circle cx="148" cy="170" r="4.5"/>
    <circle cx="110" cy="176" r="4.5"/>
    <circle cx="72" cy="170" r="4.5"/>
    <circle cx="38" cy="153" r="4.5"/>
    <circle cx="17" cy="128" r="4.5"/>
    <circle cx="14" cy="110" r="4.5"/>
    <circle cx="17" cy="92" r="4.5"/>
    <circle cx="38" cy="67" r="4.5"/>
    <circle cx="72" cy="50" r="4.5"/>
  </g>

  <!-- Pontos de reflexo branco nas chumbadas -->
  <g fill="#ffffff">
    <circle cx="109" cy="43" r="1.5"/>
    <circle cx="147" cy="49" r="1.5"/>
    <circle cx="181" cy="66" r="1.5"/>
    <circle cx="202" cy="91" r="1.5"/>
    <circle cx="205" cy="109" r="1.5"/>
    <circle cx="202" cy="127" r="1.5"/>
    <circle cx="181" cy="152" r="1.5"/>
    <circle cx="147" cy="169" r="1.5"/>
    <circle cx="109" cy="175" r="1.5"/>
    <circle cx="71" cy="169" r="1.5"/>
    <circle cx="37" cy="152" r="1.5"/>
    <circle cx="16" cy="127" r="1.5"/>
    <circle cx="13" cy="109" r="1.5"/>
    <circle cx="16" cy="91" r="1.5"/>
    <circle cx="37" cy="66" r="1.5"/>
    <circle cx="71" cy="49" r="1.5"/>
  </g>

  <!-- Nó central de união da tarrafa (Branco náutico com relevo) -->
  <circle cx="110" cy="110" r="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#whiteGleam)"/>
  <circle cx="110" cy="110" r="4" fill="#38bdf8"/>

  <!-- Corda de tração principal branca/prateada subindo para o barco -->
  <path d="M 110 110 Q 106 65 110 0" stroke="#ffffff" stroke-width="3.2" fill="none" stroke-linecap="round" filter="url(#whiteGleam)"/>
</svg>
