<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="pombaSombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="pombaAsa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <g filter="url(#pombaSombra)">
    <!-- Asinha Esquerda (Fundo) -->
    <path d="M42 46 C32 30 18 24 12 28 C8 32 16 48 36 54 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Cauda -->
    <path d="M22 62 C10 68 6 78 8 82 C14 84 26 76 34 68 Z" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Corpo Suave e Gordinho -->
    <path d="M30 64 C35 70 52 74 65 66 C75 58 78 48 74 38 C70 30 58 28 48 34 C38 40 25 54 30 64 Z" fill="url(#pombaAsa)" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Asinha Direita (Frente) -->
    <path d="M46 48 C42 28 54 12 65 14 C74 16 68 38 48 58 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Cabecinha -->
    <circle cx="70" cy="35" r="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Olho Expressivo e Brilhante -->
    <circle cx="74" cy="33" r="3" fill="#0f172a"/>
    <circle cx="75" cy="32" r="1.2" fill="#ffffff"/>

    <!-- Biquinho Laranja Dourado -->
    <polygon points="82,34 94,38 82,41" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>

    <!-- Raminho de Oliveira Verde de Esperança no Bico -->
    <path d="M88 39 Q94 44 98 42" stroke="#15803d" stroke-width="2" fill="none"/>
    <ellipse cx="96" cy="40" rx="3.5" ry="2" transform="rotate(-25 96 40)" fill="#22c55e"/>
    <ellipse cx="92" cy="43" rx="3" ry="1.8" transform="rotate(35 92 43)" fill="#4ade80"/>
  </g>
</svg>