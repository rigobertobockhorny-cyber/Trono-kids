<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg11" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a5f3fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="sh11">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg11)" stroke="#2dd4bf" stroke-width="4" filter="url(#sh11)"/>
  <!-- Lupa mágica 3D -->
  <g transform="translate(54, 52)" filter="url(#sh11)">
    <!-- Cabo -->
    <path d="M22 22 L46 46" stroke="#b45309" stroke-width="10" stroke-linecap="round"/>
    <path d="M22 22 L46 46" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <!-- Aro -->
    <circle cx="0" cy="0" r="30" fill="none" stroke="#fde047" stroke-width="8"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#ca8a04" stroke-width="2"/>
    <!-- Lente de vidro -->
    <circle cx="0" cy="0" r="26" fill="url(#glass)"/>
    <!-- Florzinha ampliada dentro da lente -->
    <circle cx="0" cy="0" r="7" fill="#fbbf24"/>
    <circle cx="-10" cy="0" r="6" fill="#f43f5e" opacity="0.9"/>
    <circle cx="10" cy="0" r="6" fill="#f43f5e" opacity="0.9"/>
    <circle cx="0" cy="-10" r="6" fill="#f43f5e" opacity="0.9"/>
    <circle cx="0" cy="10" r="6" fill="#f43f5e" opacity="0.9"/>
    <!-- Brilho no vidro -->
    <path d="M-16 -16 Q-6 -24 6 -20" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <!-- Brilho no topo -->
  <path d="M16 16 Q64 8 112 16 Q64 32 16 16 Z" fill="#ffffff" opacity="0.25"/>
</svg>