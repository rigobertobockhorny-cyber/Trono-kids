  <path d="M102 70 Q98 35 106 20 M110 75 Q106 40 102 26" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
  <!-- Cesto de junco flutuando -->
  <g transform="translate(64, 68)" filter="url(#sh15)">
    <!-- Cobertorzinho azul do bebê -->
    <ellipse cx="0" cy="-4" rx="22" ry="12" fill="#bae6fd"/>
    <circle cx="-6" cy="-4" r="7" fill="#fed7aa"/> <!-- rostinho do bebê dormindo -->
    <!-- Cesto de junco -->
    <ellipse cx="0" cy="4" rx="32" ry="18" fill="#92400e" stroke="#713f12" stroke-width="2.5"/>
    <ellipse cx="0" cy="0" rx="30" ry="14" fill="#b45309"/>
    <!-- Tampa de palha semiaberta -->
    <path d="M-8 -14 Q14 -28 32 -10" stroke="#d97706" stroke-width="4.5" stroke-linecap="round"/>
  </g>
  <!-- Ondas e vitória-régia -->
  <path d="M12 90 Q34 82 56 90 T100 90 T116 90 L116 112 L12 112 Z" fill="#0369a1"/>
  <circle cx="88" cy="94" r="7" fill="#22c55e"/>
