<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130" width="100%" height="100%">
  <defs>
    <filter id="daviShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#daviShadow)">
    <!-- Harpa de Madeira nas Costas -->
    <path d="M28 45 C20 30 18 15 32 12 C40 10 46 22 42 35 Z" fill="#b45309" stroke="#78350f" stroke-width="2"/>
    <line x1="26" y1="20" x2="35" y2="40" stroke="#fef08a" stroke-width="1.2"/>
    <line x1="30" y1="18" x2="38" y2="38" stroke="#fef08a" stroke-width="1.2"/>
    
    <!-- Pernas e Sandálias -->
    <rect x="36" y="92" width="9" height="24" rx="4" fill="#fed7aa"/>
    <rect x="55" y="92" width="9" height="24" rx="4" fill="#fed7aa"/>
    <ellipse cx="40" cy="118" rx="8" ry="4" fill="#78350f"/>
    <ellipse cx="60" cy="118" rx="8" ry="4" fill="#78350f"/>
    
    <!-- Túnica Bíblica de Pastor (Bege com faixa marrom) -->
    <path d="M30 50 L70 50 L76 96 L24 96 Z" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <!-- Cinto de Couro -->
    <rect x="27" y="66" width="46" height="8" rx="2" fill="#92400e"/>
    
    <!-- Braços -->
    <path d="M26 52 C20 62 20 75 26 82" stroke="#fed7aa" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M74 52 C80 62 80 75 74 82" stroke="#fed7aa" stroke-width="7" stroke-linecap="round" fill="none"/>
    
    <!-- Cabeça e Rosto de Menino -->
    <circle cx="50" cy="32" r="16" fill="#fed7aa"/>
    <!-- Cabelinho Ruivo Ondulado -->
    <path d="M34 32 C32 16 42 8 52 8 C62 8 70 16 66 32 C60 18 40 18 34 32 Z" fill="#b45309"/>
    <!-- Faixinha da Cabeça -->
    <path d="M34 26 C42 22 58 22 66 26" stroke="#0284c7" stroke-width="3" stroke-linecap="round" fill="none"/>
    
    <!-- Olhos Grandes Expressivos -->
    <circle cx="45" cy="32" r="2.5" fill="#0f172a"/>
    <circle cx="46" cy="31" r="1" fill="#ffffff"/>
    <circle cx="55" cy="32" r="2.5" fill="#0f172a"/>
    <circle cx="56" cy="31" r="1" fill="#ffffff"/>
    
    <!-- Sorriso de Confiança em Deus -->
    <path d="M46 38 Q50 42 54 38" stroke="#78350f" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
</svg>