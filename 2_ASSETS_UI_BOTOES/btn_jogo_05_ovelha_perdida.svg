<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="sh5">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg5)" stroke="#6ee7b7" stroke-width="4" filter="url(#sh5)"/>
  <!-- Ovelhinha -->
  <g transform="translate(64, 62)" filter="url(#sh5)">
    <!-- Corpo fofo (bolhas de lã) -->
    <circle cx="-16" cy="6" r="14" fill="#ffffff"/>
    <circle cx="16" cy="6" r="14" fill="#ffffff"/>
    <circle cx="0" cy="14" r="15" fill="#ffffff"/>
    <circle cx="-12" cy="-6" r="13" fill="#ffffff"/>
    <circle cx="12" cy="-6" r="13" fill="#ffffff"/>
    <circle cx="0" cy="-10" r="14" fill="#ffffff"/>
    <!-- Patinhas pretas -->
    <rect x="-14" y="20" width="6" height="14" rx="3" fill="#334155"/>
    <rect x="8" y="20" width="6" height="14" rx="3" fill="#334155"/>
    <!-- Cabeça da ovelha -->
    <ellipse cx="0" cy="2" rx="14" ry="16" fill="#f8fafc"/>
    <!-- Orelhas caídas -->
    <ellipse cx="-16" cy="-2" rx="6" ry="11" transform="rotate(-30 -16 -2)" fill="#fed7aa"/>
    <ellipse cx="16" cy="-2" rx="6" ry="11" transform="rotate(30 16 -2)" fill="#fed7aa"/>
    <!-- Topete fofo -->
    <circle cx="-4" cy="-12" r="5" fill="#ffffff"/>
    <circle cx="4" cy="-12" r="5" fill="#ffffff"/>
    <!-- Olhinhos -->
    <circle cx="-5" cy="0" r="2.5" fill="#0f172a"/>
    <circle cx="5" cy="0" r="2.5" fill="#0f172a"/>
    <!-- Focinho -->
    <ellipse cx="0" cy="8" rx="3.5" ry="2.5" fill="#f472b6"/>
  </g>
  <!-- Brilho no topo -->
  <path d="M16 16 Q64 8 112 16 Q64 32 16 16 Z" fill="#ffffff" opacity="0.25"/>
</svg>