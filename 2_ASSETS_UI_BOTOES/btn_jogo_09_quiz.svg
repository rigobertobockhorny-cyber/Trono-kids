<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg9" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gold9" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="sh9">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg9)" stroke="#c084fc" stroke-width="4" filter="url(#sh9)"/>
  <!-- Estrela de Troféu -->
  <g transform="translate(64, 58)" filter="url(#sh9)">
    <polygon points="0,-36 10,-12 36,-10 16,10 22,34 0,20 -22,34 -16,10 -36,-10 -10,-12" fill="url(#gold9)" stroke="#a16207" stroke-width="2.5"/>
    <circle cx="0" cy="2" r="14" fill="#ffffff" opacity="0.95"/>
    <text x="0" y="8" font-family="'Fredoka', sans-serif" font-size="18" font-weight="900" fill="#6d28d9" text-anchor="middle">?</text>
  </g>
  <!-- Base do troféu -->
  <rect x="46" y="90" width="36" height="8" rx="4" fill="url(#gold9)" filter="url(#sh9)"/>
  <!-- Brilhos -->
  <circle cx="28" cy="30" r="3" fill="#fde047"/>
  <circle cx="100" cy="36" r="2.5" fill="#fde047"/>
