<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="sh2">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg2)" stroke="#a855f7" stroke-width="4" filter="url(#sh2)"/>
  <!-- Moeda 1 (fundo) -->
  <g transform="translate(42, 74)">
    <circle cx="0" cy="0" r="22" fill="#a16207" filter="url(#sh2)"/>
    <circle cx="0" cy="0" r="20" fill="url(#gold)"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#713f12" stroke-width="2" stroke-dasharray="3,2"/>
  </g>
  <!-- Moeda 2 (direita) -->
  <g transform="translate(86, 70)">
    <circle cx="0" cy="0" r="22" fill="#a16207" filter="url(#sh2)"/>
    <circle cx="0" cy="0" r="20" fill="url(#gold)"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#713f12" stroke-width="2" stroke-dasharray="3,2"/>
  </g>
  <!-- Moeda 3 (centro frente) -->
  <g transform="translate(64, 52)">
    <circle cx="0" cy="0" r="26" fill="#a16207" filter="url(#sh2)"/>
    <circle cx="0" cy="0" r="24" fill="url(#gold)"/>
    <circle cx="0" cy="0" r="19" fill="none" stroke="#713f12" stroke-width="2.5" stroke-dasharray="4,2.5"/>
    <text x="0" y="8" font-family="'Fredoka', sans-serif" font-size="22" font-weight="900" fill="#713f12" text-anchor="middle">✝</text>
  </g>
  <!-- Brilhos estelares -->
  <path d="M96 28 L98 34 L104 36 L98 38 L96 44 L94 38 L88 36 L94 34 Z" fill="#fde047"/>
  <path d="M28 42 L29 46 L33 47 L29 48 L28 52 L27 48 L23 47 L27 46 Z" fill="#fde047"/>
  <!-- Brilho no topo -->
  <path d="M16 16 Q64 8 112 16 Q64 32 16 16 Z" fill="#ffffff" opacity="0.25"/>
</svg>